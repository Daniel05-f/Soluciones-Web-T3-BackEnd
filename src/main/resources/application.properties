spring.application.name=swapp16045-backend
server.port = 9494

# JPA / Hibernate settings
spring.jpa.database=postgresql
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

spring.datasource.driver-class-name=org.postgresql.Driver
# Desde Spring Boot 3.1
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://192.168.0.13:5432/swapp16045
spring.datasource.username=postgres
spring.datasource.password=Admin123*

# Cambiar la ruta por defecto de la interfaz gráfica de Swagger (swagger-ui/index.html)
# springdoc.swagger-ui.path=/swagger-ui.html

# Cambiar la ruta del archivo JSON con la especificación OpenAPI (v3/api-docs)
# springdoc.api-docs.path=/api-docs

